<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-label="Santa in his sleigh pulled by two reindeer">
  <!-- Sparkle trail -->
  <g fill="#fbbf24">
    <circle cx="14" cy="150" r="3" opacity=".45"/>
    <circle cx="34" cy="138" r="2.4" opacity=".6"/>
    <circle cx="22" cy="122" r="1.8" opacity=".5"/>
    <path d="M48 160l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".8"/>
    <path d="M30 104l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".55"/>
  </g>

  <!-- Reins -->
  <path d="M196 106 C 260 96, 320 92, 368 98" fill="none" stroke="#7c2d12" stroke-width="2.5"/>
  <path d="M368 98 C 410 96, 450 92, 492 96" fill="none" stroke="#7c2d12" stroke-width="2.5"/>

  <!-- Back reindeer -->
  <g transform="translate(310 70)">
    <path d="M10 70 L-6 104" stroke="#5b3a1e" stroke-width="7" stroke-linecap="round"/>
    <path d="M24 72 L30 106" stroke="#5b3a1e" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 70 L96 92" stroke="#5b3a1e" stroke-width="7" stroke-linecap="round"/>
    <path d="M82 66 L104 76" stroke="#5b3a1e" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="48" cy="56" rx="44" ry="22" fill="#8b5a2b"/>
    <ellipse cx="46" cy="64" rx="28" ry="9" fill="#c49a6c"/>
    <path d="M4 50 q-12 -6 -10 -16 q8 6 14 8z" fill="#8b5a2b"/>
    <path d="M78 46 L96 16" stroke="#8b5a2b" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="104" cy="12" rx="17" ry="12" fill="#8b5a2b"/>
    <ellipse cx="118" cy="16" rx="7" ry="5.5" fill="#6b4423"/>
    <circle cx="106" cy="8" r="2.6" fill="#1f2937"/>
    <path d="M94 2 q-4 -14 -12 -20 M90 -8 q-8 -2 -12 2 M100 0 q2 -16 10 -22 M105 -10 q8 -2 10 4" stroke="#d6b48a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="70" y="38" width="22" height="7" rx="3" fill="#b91c1c" transform="rotate(-55 81 41)"/>
  </g>

  <!-- Lead reindeer (red nose) -->
  <g transform="translate(430 64)">
    <path d="M10 70 L-8 102" stroke="#6b4423" stroke-width="7" stroke-linecap="round"/>
    <path d="M24 72 L28 108" stroke="#6b4423" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 70 L98 90" stroke="#6b4423" stroke-width="7" stroke-linecap="round"/>
    <path d="M82 66 L106 72" stroke="#6b4423" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="48" cy="56" rx="44" ry="22" fill="#9a6532"/>
    <ellipse cx="46" cy="64" rx="28" ry="9" fill="#d2a978"/>
    <path d="M4 50 q-12 -6 -10 -16 q8 6 14 8z" fill="#9a6532"/>
    <path d="M78 46 L96 16" stroke="#9a6532" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="104" cy="12" rx="17" ry="12" fill="#9a6532"/>
    <circle cx="121" cy="15" r="7" fill="#ef4444"/>
    <circle cx="123" cy="13" r="2.2" fill="#fecaca"/>
    <circle cx="106" cy="8" r="2.6" fill="#1f2937"/>
    <path d="M94 2 q-4 -14 -12 -20 M90 -8 q-8 -2 -12 2 M100 0 q2 -16 10 -22 M105 -10 q8 -2 10 4" stroke="#e5c79f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="70" y="38" width="22" height="7" rx="3" fill="#b91c1c" transform="rotate(-55 81 41)"/>
    <circle cx="80" cy="42" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- Sleigh -->
  <g>
    <!-- Gift sack -->
    <path d="M70 92 q-6 -40 22 -52 q30 -6 34 26 q2 20 -6 30z" fill="#b45309"/>
    <path d="M86 44 q6 -8 14 -4" stroke="#7c2d12" stroke-width="3" fill="none"/>
    <rect x="96" y="56" width="22" height="20" rx="2" fill="#16a34a"/>
    <rect x="105" y="56" width="4" height="20" fill="#fde68a"/>
    <!-- Santa -->
    <path d="M128 96 q4 -42 34 -46 q26 2 30 40z" fill="#dc2626"/>
    <rect x="128" y="84" width="64" height="8" fill="#f8fafc"/>
    <circle cx="160" cy="44" r="16" fill="#fcd9b6"/>
    <path d="M144 48 q16 30 34 0 q-4 18 -17 20 q-13 -2 -17 -20z" fill="#f8fafc"/>
    <path d="M152 46 q8 4 16 0" stroke="#e5e7eb" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="166" cy="40" r="2.2" fill="#1f2937"/>
    <circle cx="172" cy="46" r="3" fill="#f9a8a8"/>
    <path d="M142 36 q14 -26 38 -8 q-14 -6 -22 2z" fill="#dc2626"/>
    <path d="M142 36 q-10 -10 -4 -22 q6 14 18 16z" fill="#dc2626"/>
    <circle cx="137" cy="14" r="6" fill="#f8fafc"/>
    <rect x="140" y="32" width="42" height="7" rx="3.5" fill="#f8fafc"/>
    <!-- Waving arm -->
    <path d="M180 66 q16 -10 22 -26" stroke="#dc2626" stroke-width="11" fill="none" stroke-linecap="round"/>
    <circle cx="203" cy="38" r="6.5" fill="#1f2937"/>
    <!-- Sleigh body -->
    <path d="M56 92 h150 q14 0 16 -14 q2 -10 -6 -14 q12 -2 14 10 q2 30 -26 40 H90 q-30 0 -34 -22z" fill="#b91c1c"/>
    <path d="M62 100 h138" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 92 q-12 -4 -10 -22 q2 -10 10 -8" stroke="#b91c1c" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Runner -->
    <path d="M76 132 v14 M190 130 v16" stroke="#a16207" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 146 H214 q24 0 26 -18 q1 -9 -7 -10" stroke="#ca8a04" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
